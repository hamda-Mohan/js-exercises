<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js-exercise38</title>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            background-color: #34344b;
            color: white;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            position: fixed;
            width: 100%;
            top: 0;
        }

        .brand-title {
            font-size: 1.5rem;
            line-height: 60px;
        }

        .navbar-links {
            height: 100%;
        }

        .navbar-links ul {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .navbar-links li {
            padding: 0 10px;
        }

        .navbar-links a {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            line-height: 60px;
            display: block;
        }

        .navbar-links a:hover {
            background-color: #1860be;
            border-radius: 2px;
        }

        .toggle-button {
            position: absolute;
            top: 15px;
            right: 20px;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 21px;
            cursor: pointer;
        }

        .toggle-button .bar {
            height: 3px;
            width: 100%;
            background-color: white;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .container {
            text-align: center;
        }

        .homesection {
            background-color: tomato;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .aboutsection {
            background-color: #4CAF50;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .servicesection {
            background-color: #2196F3;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .portfolio {
            background-color: #81100c;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .blog {
            background-color: #9C27B0;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .careers {
            background-color: #4f5369;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contact {
            background-color: #009688;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .toggle-button {
                display: flex;
            }

            .navbar-links {
                /* display: none; */
                width: 100%;
                max-height: 0;
                overflow: hidden;
                opacity: 0;
                transition: max-height 0.5s ease-out, opacity 0.5 ease-out
            }

            .navbar-links ul {
                flex-direction: column;
                width: 100%;
            }

            .navbar-links li {
                text-align: center;
            }

            .navbar-links a {
                padding: 10px;
                line-height: 20px;
                /* width: 100%; */
            }

            .navbar.active .navbar-links {
                display: block;
                max-height: 500px;
                opacity: 1;
                transition: max-height 0.5s ease-in-out, opacity 0.5s ease-out;

            }

            .navbar.active .toggle-button .bar:nth-child(2) {
                opacity: 0;

            }

            .navbar.active .toggle-button .bar:nth-child(1) {

                transform: translateY(8px) rotate(45deg);
            }

            .navbar.active .toggle-button .bar:nth-child(3) {
                transform: translateY(-8px) rotate(-45deg);
            }

        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="brand-title">My Website</div>
        <a href="#" class="toggle-button">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </a>
        <div class="navbar-links">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#portfolio">Portfolio</a></li>
                <li><a href="#blog">Blog</a></li>
                <li><a href="#careers">Careers</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>
    <div class="container">
        <div class="homesection" id="home">
            <h1>Home </h1>

        </div>
        <div class="aboutsection" id="about">
            <h1>About Us</h1>
        </div>
        <div class="servicesection" id="services">
            <h1>Our Services</h1>
        </div>
        <div class="portfolio" id="portfolio">
            <h1>Our Portfolio</h1>
        </div>
        <div class="blog" id="blog">
            <h1>Our Blog</h1>
        </div>
        <div class="careers" id="careers">
            <h1>Careers</h1>
        </div>
        <div class="contact" id="contact">
            <h1>Contact Us</h1>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
