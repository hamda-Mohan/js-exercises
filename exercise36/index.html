<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color picker</title>
    <style>
        .container{
            width: 400px;
            margin: 0 auto;
            text-align: center;
        }
        h1{
            margin-top: 20px;
            background-color: #007BFF;
            color: white;
            padding: 10px;
            border-radius: 10px;

        }
        .preview{
            width: 100%;
            height: 100px;
            background-color: #eee;
            margin-top: 20px;
            border-radius: 10px;
        }
        .col-history{
            list-style-type: none;
            padding: 0;
        }
        .col-history li{
            font-size: 18px;
            margin-top: 10px;
        }
        button{
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>color picker</h1>
        <input type="color" id="colorpick">
        <div class="preview">
            <h3> color preview</h3>
        </div>
        <ul class="col-history"></ul>
        <button id="rem-color">Clear History </button>
    </div>
    <script src="js-exercise36.js"></script>
</body>
</html>
