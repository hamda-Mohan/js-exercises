<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <video id="video">
            <source src="thevideo/V1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="controls">
            <div class="controls-up">
                <!-- progress -->
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>

                    <div class="time">
                        <span id="current-time">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>
            </div>
            <div class="controls-down">
                <div class="volume-container">
                    <i class="fas fa-volume-down"></i>
                    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
                </div>

                <!-- buttons -->
                <div class="buttons">
                    <button id="prev-btn" class="control-btn"><i class="fas fa-backward"></i></button>
                    <button id="play-btn" class="control-btn"><i class="fas fa-play"></i></button>
                    <button id="next-btn" class="control-btn"><i class="fas fa-forward"></i></button>
                </div>

                <div class="speed-container">
                    <i class="fas fa-tachometer-alt"></i>
                    <select id="speed">
                        <option value="0.5">0.5x</option>
                        <option value="1" selected>1x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2x</option>
                    </select>
                </div>

            </div>





        </div>

    </div>
    <script src="js-exercise40.js"></script>

</body>


</html>
